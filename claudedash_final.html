<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Timestamp Panels</title>
<style>
  :root {
    --bg: #0f0f0f;
    --panel: #181818;
    --accent: #ff0033;
    --text: #f1f1f1;
    --muted: #9a9a9a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 30px 16px 60px;
  }
  h1 {
    text-align: center;
    font-size: 1.2rem;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 30px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 36px;
    max-width: 900px;
    margin: 0 auto;
  }
 

  .video-card {
    background: var(--panel);
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.4);
  }
  .video-title {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .video-wrap {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
  }
  .video-wrap > div { width: 100%; height: 100%; }

  .chip-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }
  .chip {
    background: #222;
    border: 1px solid #2a2a2a;
    color: var(--text);
    padding: 8px 12px;
    border-radius: 18px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: background 0.15s, border-color 0.15s;
  }
  .chip:hover { background: #2b2b2b; border-color: var(--accent); }
  .chip .label { color: var(--muted); margin-left: 5px; }
</style>
</head>
<body>

<h1>Video Timestamp Panels</h1>

<div class="grid" id="grid"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
  // ---- CONFIG: edit videoId and timestamps for each panel ----
  const videoConfigs = [
    {
      id: 'panel1',
      videoId: 'gEEa5g8abaU',
      title: 'Video 1',
      timestamps: [
        { seconds: 73,   label: 'Intro' },
        { seconds: 180,  label: 'Section A' },
        { seconds: 295,  label: 'Section B' },
        { seconds: 480,  label: 'Section B' },
        { seconds: 550,  label: 'Section B' }
      ]
    },
    {
      id: 'panel2',
      videoId: '2nq8YjWIIUI',
      title: 'Video 2',
      timestamps: [
        { seconds: 275,   label: 'Intro' },
        { seconds: 360,  label: 'Key Point' },
        { seconds: 484, label: 'Conclusion' },
        { seconds: 530, label: 'Conclusion' },
        { seconds: 660, label: 'Conclusion' }
      ]
    },
    {
      id: 'panel3',
      videoId: 'Qi5cidXHhhE',
      title: 'Video 3',
      timestamps: [
        { seconds: 220,   label: 'Start' },
        { seconds: 335,  label: 'Highlight' },
        { seconds: 410, label: 'End' },
        { seconds: 642, label: 'End' },
        { seconds: 805, label: 'End' },
        { seconds: 900, label: 'End' }
      ]
    },
    {
      id: 'panel4',
      videoId: 'bRE9FW99ZgM',
      title: 'Video 4',
      timestamps: [
        { seconds: 0,   label: 'Start' },
        { seconds: 40,  label: 'Middle' },
        { seconds: 100, label: 'Finish' }
      ]
    },
    {
      id: 'panel5',
      videoId: 'VIDEO_ID_5',
      title: 'Video 5',
      timestamps: [
        { seconds: 0,   label: 'Opening' },
        { seconds: 55,  label: 'Turning Point' },
        { seconds: 130, label: 'Wrap-up' }
      ]
    }
  ];

  const players = {}; // keyed by panel id

  function formatSeconds(sec) {
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = Math.floor(sec % 60);
    const pad = n => String(n).padStart(2, '0');
    return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
  }

  function buildDOM() {
    const grid = document.getElementById('grid');
    videoConfigs.forEach(cfg => {
      const card = document.createElement('div');
      card.className = 'video-card';

      const title = document.createElement('div');
      title.className = 'video-title';
      title.textContent = cfg.title;
      card.appendChild(title);

      const wrap = document.createElement('div');
      wrap.className = 'video-wrap';
      const playerDiv = document.createElement('div');
      playerDiv.id = `yt-${cfg.id}`;
      wrap.appendChild(playerDiv);
      card.appendChild(wrap);

      const chipList = document.createElement('div');
      chipList.className = 'chip-list';
      cfg.timestamps.forEach(ts => {
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.innerHTML = `${ts.label} <span class="label">${formatSeconds(ts.seconds)}</span>`;
        chip.onclick = () => jumpTo(cfg.id, ts.seconds);
        chipList.appendChild(chip);
      });
      card.appendChild(chipList);

      grid.appendChild(card);
    });
  }

  function jumpTo(panelId, seconds) {
    const p = players[panelId];
    if (!p || typeof p.seekTo !== 'function') return;
    p.seekTo(seconds, true);
    p.playVideo();
  }

  function onYouTubeIframeAPIReady() {
    videoConfigs.forEach(cfg => {
      players[cfg.id] = new YT.Player(`yt-${cfg.id}`, {
        videoId: cfg.videoId,
        playerVars: {
          rel: 0,
          modestbranding: 1
        }
      });
    });
  }

  buildDOM();
</script>

</body>
</html>
